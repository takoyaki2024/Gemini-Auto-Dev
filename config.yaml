model: gemini-3.7-flash
workspace: ./workspace
auto_install: true
auto_commit: true
allow_delete: true
allow_network: true
command_timeout_seconds: 300
fast_mode: true

billing:
  allowed: false
  paid_fallback: false
  auto_upgrade: false

manager:
  backend: deterministic
  gemini_only_for_large_tasks: false

local_ai:
  enabled: false
  endpoint: http://127.0.0.1:11434
  model: qwen3:4b
  timeout_seconds: 30
  role: optional_light_tasks_only

gemini:
  max_retries: 2
  free_only: true
  paid_fallback: false
  on_quota_exhausted: stop

context:
  max_chars: 80000
  max_files: 12
  selector: deterministic

workers:
  max_parallel: 1

stuck:
  identical_error_limit: 3
  escape_attempts: 1

security:
  protect_outside_workspace: true
  protect_secrets: true
